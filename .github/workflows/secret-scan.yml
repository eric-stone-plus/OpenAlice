# A pull_request run executes the workflow definition from the PR's merge ref,
# so this file cannot enforce its own integrity. Protect .github/workflows/**
# with CODEOWNERS and branch protection; this workflow is the scan, not the gate.
name: Secret scan

on:
  push:
    branches: [dev, master]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  # A push run is unique per commit and a schedule run per run id, so a newer
  # event cannot supersede a still-pending scan. Same-repo PR runs are not
  # cancelled; a force-pushed commit remains reachable in the base repo.
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || github.event_name == 'schedule' && github.run_id || '' }}
  cancel-in-progress: false

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        env:
          # The `[allowlist]` table and `.gitleaksignore` fingerprints require
          # >= 8.21.2; pin both the version and the release tarball digest so a
          # changed asset cannot run code.
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --retry-delay 2 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version
      - name: Scan full history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          # A PR can edit .gitleaks.toml/.gitleaksignore in its own tree. Load
          # the trusted base revision's policy instead of the PR's copy, and
          # scan only commits introduced by the PR. The base history was
          # scanned on push; re-scanning it here would also make a historical
          # finding fail every PR that adds a new allowlist entry.
          if [ -n "${BASE_SHA:-}" ]; then
            git show "${BASE_SHA}:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"
            git show "${BASE_SHA}:.gitleaksignore" > "$RUNNER_TEMP/gitleaksignore" 2>/dev/null || : > "$RUNNER_TEMP/gitleaksignore"
            gitleaks git --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/gitleaksignore" --log-opts="${BASE_SHA}..HEAD" --ignore-gitleaks-allow --redact --no-banner
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            # A force-push can leave the previous tip unreachable. Fail
            # explicitly instead of letting `git show` abort with an opaque
            # error and no scan.
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "::error::previous push tip ${BEFORE_SHA} is unreachable; cannot load the trusted policy"
              exit 1
            fi
            # A direct push can add a secret and a matching ignore entry in the
            # same commit. Scan only the pushed commits with the previous
            # trusted policy so the new ignore cannot hide it.
            git show "${BEFORE_SHA}:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"
            git show "${BEFORE_SHA}:.gitleaksignore" > "$RUNNER_TEMP/gitleaksignore" 2>/dev/null || : > "$RUNNER_TEMP/gitleaksignore"
            gitleaks git --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/gitleaksignore" --log-opts="${BEFORE_SHA}..HEAD" --ignore-gitleaks-allow --redact --no-banner
          else
            gitleaks git --config .gitleaks.toml --ignore-gitleaks-allow --redact --no-banner
          fi
